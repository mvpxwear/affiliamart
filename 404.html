<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AffiliaMart</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:#f5f7f6;color:#17201a}
.box{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:32px;max-width:420px;box-shadow:0 10px 35px rgba(0,0,0,.06)}
.logo{font-size:28px;font-weight:800;color:#16a34a;margin-bottom:12px}.muted{color:#6b7280;font-size:14px}
</style>
<script>
(function(){
  const path=window.location.pathname.split('/').filter(Boolean);
  if(!path.length){window.location.replace('index.html');return;}

  const file=path[path.length-1];
  const isGithubPages=window.location.hostname.endsWith('.github.io');
  // On GitHub project pages, the first path segment is the repository/base path.
  const base=isGithubPages ? '/' + path[0] : '';
  const slug=decodeURIComponent(file).replace(/\.html$/i,'');

  if(slug && slug!=='404' && slug!=='index'){
    window.location.replace(base + '/product.html?slug=' + encodeURIComponent(slug));
  }else{
    window.location.replace(base + '/index.html');
  }
})();
</script>
</head>
<body>
<div class="box"><div class="card"><div class="logo">AffiliaMart</div><div class="muted">Membuka produk...</div></div></div>
</body>
</html>
