/* =========================
UTILITY
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&")
.replace(/</g,"<")
.replace(/>/g,">")
.replace(/"/g,""")
.replace(/'/g,"'");

}

function formatRupiah(value){

if(
value === null ||
value === undefined ||
value === ""
){
return "-";
}

const number =
Number(value);

if(!Number.isFinite(number)){
return "-";
}

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(number);

}

function makeSlug(text){

return String(text || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s-]/g,"")
.trim()
.replace(/\s+/g,"-")
.replace(/-+/g,"-");

}

/* =========================
GET SLUG
========================= */

function getSlug(){

const params =
new URLSearchParams(
window.location.search
);

const querySlug =
params.get("slug");

if(querySlug){

try{  

  return decodeURIComponent(  
    querySlug  
  );  

}catch(error){  

  return querySlug;  

}

}

const path =
window.location.pathname
.split("/")
.filter(Boolean);

const last =
path[path.length - 1] || "";

if(
last &&
last !== "product.html"
){

try{  

  return decodeURIComponent(  
    last  
  );  

}catch(error){  

  return last;  

}

}

return "";

}

/* =========================
CANONICAL
========================= */

function getProductURL(slug){

return (
BASE_URL +
"/product.html?slug=" +
encodeURIComponent(
makeSlug(slug)
)
);

}

/* =========================
SEO
========================= */

function updateSEO(
product,
category
){

const name =
String(
product.name ||
"Produk"
).trim();

const slug =
makeSlug(
product.slug ||
name
);

const description =
String(
product.description ||
Lihat detail ${name} di AffiliaMart.
)
.replace(/\s+/g," ")
.trim()
.slice(0,160);

const canonical =
getProductURL(slug);

const images =
getGallery(product);

const image =
images.length
? images[0]
: "";

/*
TITLE
*/

document.title =
${name} - AffiliaMart;

/*
META DESCRIPTION
*/

const metaDescription =
document.querySelector(
'meta[name="description"]'
);

if(metaDescription){

metaDescription.setAttribute(  
  "content",  
  description  
);

}

/*
CANONICAL
*/

const canonicalElement =
document.getElementById(
"canonical"
);

if(canonicalElement){

canonicalElement.setAttribute(  
  "href",  
  canonical  
);

}

/*
OPEN GRAPH
*/

setMeta(
"ogTitle",
"content",
${name} - AffiliaMart
);

setMeta(
"ogDescription",
"content",
description
);

setMeta(
"ogUrl",
"content",
canonical
);

if(image){

setMeta(  
  "ogImage",  
  "content",  
  image  
);

}

/*
TWITTER
*/

setMeta(
"twitterTitle",
"content",
${name} - AffiliaMart
);

setMeta(
"twitterDescription",
"content",
description
);

if(image){

setMeta(  
  "twitterImage",  
  "content",  
  image  
);

}

/*
PRODUCT SCHEMA
*/

const productSchema = {

"@context":  
  "https://schema.org",  

"@type":  
  "Product",  

"name":  
  name,  

"description":  
  description,  

"url":  
  canonical

};

if(image){

productSchema.image =  
  images;

}

if(product.sku){

productSchema.sku =  
  String(  
    product.sku  
  );

}

if(category){

productSchema.category =  
  String(  
    category.name  
  );

}

/*
BRAND / SELLER
*/

productSchema.brand = {

"@type":  
  "Brand",  

"name":  
  "AffiliaMart"

};

/*
OFFER
*/

const price =
Number(
product.price
);

if(
Number.isFinite(price) &&
price >= 0
){

productSchema.offers = {  

  "@type":  
    "Offer",  

  "url":  
    canonical,  

  "priceCurrency":  
    "IDR",  

  "price":  
    price,  

  "availability":  
    product.is_active === false  
      ? "https://schema.org/OutOfStock"  
      : "https://schema.org/InStock",  

  "itemCondition":  
    "https://schema.org/NewCondition"  

};

}

/*
AGGREGATE RATING
*/

const rating =
Number(
product.rating
);

const soldCount =
Number(
product.sold_count
);

if(
Number.isFinite(rating) &&
rating > 0 &&
rating <= 5
){

const ratingData = {  

  "@type":  
    "AggregateRating",  

  "ratingValue":  
    rating,  

  "bestRating":  
    5,  

  "worstRating":  
    1  

};  


if(  
  Number.isFinite(  
    soldCount  
  ) &&  
  soldCount > 0  
){  

  ratingData.ratingCount =  
    soldCount;  

}  


productSchema.aggregateRating =  
  ratingData;

}

const productSchemaElement =
document.getElementById(
"productSchema"
);

if(productSchemaElement){

productSchemaElement.textContent =  
  JSON.stringify(  
    productSchema  
  );

}

/*
BREADCRUMB SCHEMA
*/

const breadcrumbItems = [

{  

  "@type":  
    "ListItem",  

  "position":  
    1,  

  "name":  
    "Home",  

  "item":  
    BASE_URL + "/index.html"  

}

];

let position = 2;

if(category){

breadcrumbItems.push({  

  "@type":  
    "ListItem",  

  "position":  
    position++,  

  "name":  
    String(  
      category.name  
    ),  

  "item":  
    BASE_URL +  
    "/index.html#kategori"  

});

}

breadcrumbItems.push({

"@type":  
  "ListItem",  

"position":  
  position,  

"name":  
  name,  

"item":  
  canonical

});

const breadcrumbSchema = {

"@context":  
  "https://schema.org",  

"@type":  
  "BreadcrumbList",  

"itemListElement":  
  breadcrumbItems

};

const breadcrumbSchemaElement =
document.getElementById(
"breadcrumbSchema"
);

if(breadcrumbSchemaElement){

breadcrumbSchemaElement.textContent =  
  JSON.stringify(  
    breadcrumbSchema  
  );

}

}

function setMeta(
id,
attribute,
value
){

const element =
document.getElementById(
id
);

if(element){

element.setAttribute(  
  attribute,  
  value  
);

}

}

/* =========================
VISITOR
========================= */

function getVisitorId(){

let id =
localStorage.getItem(
"affiliamart_visitor_id"
);

if(!id){

id =  
  window.crypto &&  
  crypto.randomUUID  

    ? crypto.randomUUID()  

    : "visitor-" +  
      Date.now() +  
      "-" +  
      Math.random()  
        .toString(36)  
        .slice(2);  


localStorage.setItem(  
  "affiliamart_visitor_id",  
  id  
);

}

return id;

}

/* =========================
ANALYTICS
========================= */

async function trackEvent(
eventType,
productId = null,
platform = null
){

try{

await supabaseClient  
  .from(  
    "analytics_events"  
  )  
  .insert({  

    event_type:  
      eventType,  

    product_id:  
      productId,  

    platform:  
      platform,  

    visitor_id:  
      getVisitorId()  

  });

}catch(error){

console.warn(  
  "Analytics:",  
  error  
);

}

}

/* =========================
GALLERY
========================= */

function getGallery(product){

let result = [];

if(product.image_url){

result.push(  
  product.image_url  
);

}

if(product.gallery){

if(  
  Array.isArray(  
    product.gallery  
  )  
){  

  result =  
    result.concat(  
      product.gallery  
    );  

}  

else if(  
  typeof product.gallery ===  
  "string"  
){  

  try{  

    const parsed =  
      JSON.parse(  
        product.gallery  
      );  


    if(  
      Array.isArray(parsed)  
    ){  

      result =  
        result.concat(  
          parsed  
        );  

    }  

  }catch(error){  

    /* Abaikan */  

  }  

}

}

return [

...new Set(  

  result  
    .map(  
      item =>  
        String(  
          item || ""  
        ).trim()  
    )  
    .filter(Boolean)  

)

];

}

/* =========================
GALLERY RENDER
========================= */

function renderGallery(
images,
name
){

if(!images.length){

return `  

  <div class="gallery-card">  

    <div class="main-image">  

      <div class="placeholder">  
        🛍️  
      </div>  

    </div>  

  </div>  

`;

}

let thumbs = "";

if(images.length > 1){

thumbs = `  

  <div class="thumbs">  

    ${images.map(  
      (src,index) => `  

        <button  
          type="button"  
          class="thumb ${  
            index === 0  
              ? "active"  
              : ""  
          }"  
          onclick="  
            changeImage(  
              '${escapeHTML(src)}',  
              this  
            )  
          "  
        >  

          <img  
            src="${escapeHTML(src)}"  
            alt="Gambar ${index + 1}"  
            loading="lazy"  
            onerror="  
              this.style.display='none'  
            "  
          >  

        </button>  

      `  
    ).join("")}  

  </div>  

`;

}

return `

<div class="gallery-card">  

  <div  
    class="main-image"  
    id="mainImageWrap"  
  >  

    <img  
      id="mainImage"  
      src="${escapeHTML(images[0])}"  
      alt="${escapeHTML(name)}"  
      onerror="  
        this.style.display='none'  
      "  
    >  

  </div>  

  ${thumbs}  

</div>

`;

}

function changeImage(
src,
element
){

const image =
document.getElementById(
"mainImage"
);

if(image){

image.style.display =  
  "block";  

image.src =  
  src;

}

document
.querySelectorAll(
".thumb"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);

if(element){

element.classList.add(  
  "active"  
);

}

}

/* =========================
PRODUCT URL
========================= */

function productUrl(
product
){

return (
"product.html?slug=" +
encodeURIComponent(
makeSlug(
product.slug ||
product.name
)
)
);

}

/* =========================
LOAD PRODUCT
========================= */

async function loadProduct(){

const rawSlug =
getSlug();

const slug =
makeSlug(
rawSlug
);

console.log(
"Slug produk:",
slug
);

if(!slug){

showError(  
  "Slug produk tidak ditemukan."  
);  

return;

}

const response =
await supabaseClient
.from("products")
.select(  id,   category_id,   name,   slug,   description,   image_url,   gallery,   price,   original_price,   discount_percent,   platform,   affiliate_url,   rating,   sold_count,   is_featured,   is_trending,   is_active,   created_at  )
.eq(
"slug",
slug
)
.eq(
"is_active",
true
)
.order(
"created_at",
{
ascending:false
}
)
.limit(1);

if(response.error){

console.error(  
  response.error  
);  


showError(  
  "Gagal memuat produk: " +  
  response.error.message  
);  

return;

}

let product =
response.data &&
response.data.length
? response.data[0]
: null;

/*
FALLBACK NAMA
*/

if(!product){

const fallback =  
  await supabaseClient  
    .from("products")  
    .select(`  
      id,  
      category_id,  
      name,  
      slug,  
      description,  
      image_url,  
      gallery,  
      price,  
      original_price,  
      discount_percent,  
      platform,  
      affiliate_url,  
      rating,  
      sold_count,  
      is_featured,  
      is_trending,  
      is_active,  
      created_at  
    `)  
    .eq(  
      "is_active",  
      true  
    )  
    .ilike(  
      "name",  
      rawSlug.replace(  
        /-/g,  
        " "  
      )  
    )  
    .order(  
      "created_at",  
      {  
        ascending:false  
      }  
    )  
    .limit(1);  


if(  
  !fallback.error &&  
  fallback.data &&  
  fallback.data.length  
){  

  product =  
    fallback.data[0];  

}

}

if(!product){

showError(  
  "Produk \"" +  
  rawSlug.replace(  
    /-/g,  
    " "  
  ) +  
  "\" tidak ditemukan atau sudah tidak aktif."  
);  

return;

}

console.log(
"Produk ditemukan:",
product
);

await trackEvent(
"page_view",
product.id,
product.platform ||
null
);

/* =========================
CATEGORY
========================= */

let category =
null;

if(product.category_id){

const categoryResult =

async function loadRelated(
product
){

let query =
supabaseClient
.from("products")
.select(  id,   category_id,   name,   slug,   image_url,   gallery,   price,   platform,   is_active,   created_at  )
.eq(
"is_active",
true
)
.neq(
"id",
product.id
);

if(product.category_id){

query =  
  query.eq(  
    "category_id",  
    product.category_id  
  );

}

const result =
await query
.order(
"created_at",
{
ascending:false
}
)
.limit(4);

if(result.error){

console.error(  
  result.error  
);  


document.getElementById(  
  "relatedList"  
).innerHTML =  
  "<div class='empty'>Produk terkait belum tersedia.</div>";  

return;

}

let list =
result.data || [];

if(!list.length){

const fallback =  
  await supabaseClient  
    .from("products")  
    .select(`  
      id,  
      category_id,  
      name,  
      slug,  
      image_url,  
      gallery,  
      price,  
      platform,  
      is_active,  
      created_at  
    `)  
    .eq(  
      "is_active",  
      true  
    )  
    .neq(  
      "id",  
      product.id  
    )  
    .order(  
      "created_at",  
      {  
        ascending:false  
      }  
    )  
    .limit(4);  


if(!fallback.error){  

  list =  
    fallback.data || [];  

}

}

const relatedList =
document.getElementById(
"relatedList"
);

if(!relatedList){

return;

}

if(!list.length){

relatedList.innerHTML =  
  "<div class='empty'>Belum ada produk terkait.</div>";  

return;

}

relatedList.innerHTML =
list.map(
item => {

const images =  
      getGallery(  
        item  
      );  


    const image =  
      images.length  
        ? images[0]  
        : "";  


    return `  

      <a  
        class="card"  
        href="${escapeHTML(  
          productUrl(item)  
        )}"  
      >  

        <div class="card-img">  

          ${  
            image  
              ? `  

                <img  
                  src="${escapeHTML(  
                    image  
                  )}"  
                  alt="${escapeHTML(  
                    item.name  
                  )}"  
                  loading="lazy"  
                  onerror="  
                    this.style.display='none'  
                  "  
                >  

              `  
              : `  

                <div  
                  class="placeholder"  
                  style="font-size:50px"  
                >  
                  🛍️  
                </div>  

              `  
          }  

        </div>  


        <div class="card-info">  

          <h3>  

            ${escapeHTML(  
              item.name  
            )}  

          </h3>  


          <div class="card-price">  

            ${formatRupiah(  
              item.price  
            )}  

          </div>  


          <div class="card-platform">  

            ${escapeHTML(  
              item.platform ||  
              ""  
            )}  

          </div>  

        </div>  

      </a>  

    `;  

  }  
)  
.join("");

}

/* =========================
COMPACT NUMBER
========================= */

function compactNumber(n){

n =
Number(n || 0);

if(n >= 1000000){

return (  
  n / 1000000  
)  
  .toFixed(1)  
  .replace(  
    ".0",  
    ""  
  ) +  
  "M";

}

if(n >= 1000){

return (  
  n / 1000  
)  
  .toFixed(1)  
  .replace(  
    ".0",  
    ""  
  ) +  
  "K";

}

return String(n);

}
