<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - AffiliaMart</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #16a34a;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">AffiliaMart</div>

    <p class="subtitle">Login Admin</p>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="admin@email.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" id="loginButton">
        Masuk ke Dashboard
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Kembali ke website
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://fmftcisigssgfjqqezqz.supabase.co";
const SUPABASE_KEY = "sb_publishable_0YyKpZ3_HOED9iHlgfJldw_4ZrugD7C";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Memproses...";
      message.textContent = "";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent = "Email atau password salah.";
        message.style.color = "red";

        button.disabled = false;
        button.textContent = "Masuk ke Dashboard";
        return;
      }

      const user = data.user;

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .single();

      if (profileError || !profile || profile.role !== "admin") {
        await supabaseClient.auth.signOut();

        message.textContent = "Akun ini bukan admin.";
        message.style.color = "red";

        button.disabled = false;
        button.textContent = "Masuk ke Dashboard";
        return;
      }

      message.textContent = "Login berhasil. Membuka dashboard...";
      message.style.color = "green";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 500);
    });
  </script>

</body>
</html>
