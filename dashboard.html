<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Admin - AffiliaMart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Inter",Arial,sans-serif;
  background:#f5f7f6;
  color:#17201a;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  height:70px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#16a34a;
  font-size:22px;
  font-weight:800;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.admin-name{
  font-size:13px;
  color:#6b7280;
}

.logout-btn{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
}

/* CONTAINER */

.container{
  width:90%;
  max-width:1200px;
  margin:35px auto;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:28px;
  font-weight:800;
}

.welcome p{
  margin-top:6px;
  color:#6b7280;
  font-size:14px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
}

.stat-label{
  color:#6b7280;
  font-size:13px;
}

.stat-value{
  margin-top:7px;
  font-size:28px;
  font-weight:800;
  color:#16a34a;
}

/* MENU */

.menu{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.menu button{
  border:1px solid #d1d5db;
  background:white;
  color:#374151;
  padding:11px 17px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}

.menu button.active{
  background:#16a34a;
  color:white;
  border-color:#16a34a;
}

/* CARD */

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:22px;
}

.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.card-header h2{
  font-size:20px;
  font-weight:800;
}

.add-btn{
  border:0;
  background:#16a34a;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
}

.add-btn:hover{
  background:#15803d;
}

/* CATEGORY */

.category-list{
  display:grid;
  gap:10px;
}

.category-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px;
  border:1px solid #edf0ee;
  border-radius:12px;
  background:#fafafa;
}

.category-left{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.category-icon{
  width:45px;
  height:45px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#f0fdf4;
  font-size:23px;
}

.category-info{
  min-width:0;
}

.category-name{
  font-size:14px;
  font-weight:700;
}

.category-slug{
  margin-top:3px;
  color:#9ca3af;
  font-size:12px;
}

.status{
  display:inline-block;
  margin-top:5px;
  padding:3px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
}

.status.active{
  background:#dcfce7;
  color:#15803d;
}

.status.inactive{
  background:#fee2e2;
  color:#b91c1c;
}

.category-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.edit-btn,
.delete-btn{
  border:0;
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}

.edit-btn{
  background:#eff6ff;
  color:#2563eb;
}

.delete-btn{
  background:#fee2e2;
  color:#dc2626;
}

/* PRODUCTS */

.product-list{
  display:grid;
  gap:12px;
}

.product-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px;
  border:1px solid #edf0ee;
  border-radius:13px;
  background:#fafafa;
}

.product-left{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.product-image{
  width:65px;
  height:65px;
  flex-shrink:0;
  border-radius:11px;
  object-fit:cover;
  background:#eeeeee;
}

.product-info{
  min-width:0;
}

.product-name{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-category{
  margin-top:4px;
  color:#6b7280;
  font-size:12px;
}

.product-price{
  margin-top:4px;
  color:#16a34a;
  font-size:13px;
  font-weight:700;
}

.product-platform{
  display:inline-block;
  margin-top:5px;
  background:#f3f4f6;
  padding:3px 7px;
  border-radius:5px;
  font-size:10px;
  font-weight:700;
}

.product-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

/* LOADING */

.loading,
.empty{
  text-align:center;
  padding:45px 20px;
  color:#6b7280;
  font-size:14px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-header h3{
  font-size:20px;
  font-weight:800;
}

.close-btn{
  border:0;
  background:#f3f4f6;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:18px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#16a34a;
}

.icon-preview{
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:#f0fdf4;
  border:1px solid #dcfce7;
  font-size:30px;
  margin-top:10px;
}

.checkbox-row{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
}

.checkbox input{
  width:auto;
}

.save-btn{
  width:100%;
  border:0;
  background:#16a34a;
  color:white;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
}

.save-btn:disabled{
  opacity:.6;
}

/* MESSAGE */

#message{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:320px;
  background:#17201a;
  color:white;
  padding:13px 17px;
  border-radius:10px;
  font-size:13px;
  display:none;
  z-index:2000;
}

#message.show{
  display:block;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 20px;
  }

  .admin-name{
    display:none;
  }

  .container{
    width:94%;
    margin:25px auto;
  }

  .welcome h1{
    font-size:23px;
  }

  .stats{
    grid-template-columns:1fr;
    gap:10px;
  }

  .stat{
    padding:16px;
  }

  .stat-value{
    font-size:24px;
  }

  .card{
    padding:16px;
  }

  .card-header{
    align-items:flex-start;
  }

  .card-header h2{
    font-size:17px;
  }

  .category-item,
  .product-item{
    align-items:flex-start;
  }

  .category-actions,
  .product-actions{
    flex-direction:column;
  }

  .product-image{
    width:55px;
    height:55px;
  }

  .product-name{
    max-width:150px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    AffiliaMart
  </div>

  <div class="header-right">

    <div class="admin-name" id="adminName">
      Memuat...
    </div>

    <button class="logout-btn" onclick="logout()">
      Keluar
    </button>

  </div>

</header>


<div class="container">

  <div class="welcome">

    <h1>Dashboard Admin</h1>

    <p>
      Kelola kategori dan produk AffiliaMart dari satu tempat.
    </p>

  </div>


  <!-- STAT -->

  <div class="stats">

    <div class="stat">
      <div class="stat-label">
        Total Kategori
      </div>

      <div class="stat-value" id="categoryCount">
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Total Produk
      </div>

      <div class="stat-value" id="productCount">
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Produk Aktif
      </div>

      <div class="stat-value" id="activeProductCount">
        0
      </div>
    </div>

  </div>


  <!-- MENU -->

  <div class="menu">

    <button
      id="categoryMenu"
      class="active"
      onclick="showSection('categories')"
    >
      📁 Kategori
    </button>

    <button
      id="productMenu"
      onclick="showSection('products')"
    >
      🛍️ Produk
    </button>

  </div>


  <!-- CATEGORY -->

  <section id="categoriesSection">

    <div class="card">

      <div class="card-header">

        <h2>
          Kelola Kategori
        </h2>

        <button
          class="add-btn"
          onclick="openCategoryModal()"
        >
          + Tambah
        </button>

      </div>

      <div
        id="categoryList"
        class="category-list"
      >
        <div class="loading">
          Memuat kategori...
        </div>
      </div>

    </div>

  </section>


  <!-- PRODUCTS -->

  <section
    id="productsSection"
    style="display:none;"
  >

    <div class="card">

      <div class="card-header">

        <h2>
          Kelola Produk
        </h2>

        <button
          class="add-btn"
          onclick="openProductModal()"
        >
          + Tambah Produk
        </button>

      </div>

      <div
        id="productList"
        class="product-list"
      >
        <div class="loading">
          Memuat produk...
        </div>
      </div>

    </div>

  </section>

</div>


<!-- CATEGORY MODAL -->

<div
  class="modal"
  id="categoryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="categoryModalTitle">
        Tambah Kategori
      </h3>

      <button
        class="close-btn"
        onclick="closeCategoryModal()"
      >
        ×
      </button>

    </div>


    <form id="categoryForm">

      <input
        type="hidden"
        id="categoryId"
      >


      <div class="form-group">

        <label>
          Nama Kategori
        </label>

        <input
          type="text"
          id="categoryName"
          placeholder="Contoh: Elektronik"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Slug
        </label>

        <input
          type="text"
          id="categorySlug"
          placeholder="elektronik"
          required
        >

      </div>


      <!-- ICON BARU -->

      <div class="form-group">

        <label>
          Icon Kategori
        </label>

        <select id="categoryIconSelect">

          <option value="📁">📁 Folder</option>
          <option value="📱">📱 Elektronik</option>
          <option value="👕">👕 Fashion</option>
          <option value="💄">💄 Kecantikan</option>
          <option value="🏠">🏠 Rumah</option>
          <option value="🍔">🍔 Makanan</option>
          <option value="🎮">🎮 Gaming</option>
          <option value="⚽">⚽ Olahraga</option>
          <option value="📚">📚 Buku</option>
          <option value="👜">👜 Tas</option>
          <option value="👟">👟 Sepatu</option>
          <option value="💻">💻 Komputer</option>
          <option value="🎧">🎧 Audio</option>
          <option value="⌚">⌚ Jam</option>
          <option value="🚗">🚗 Otomotif</option>
          <option value="🧸">🧸 Mainan</option>
          <option value="💍">💍 Aksesoris</option>
          <option value="🎁">🎁 Hadiah</option>

        </select>


        <input
          type="text"
          id="categoryIconCustom"
          placeholder="Atau masukkan emoji sendiri, contoh: 🌟"
          style="margin-top:8px;"
        >


        <div
          class="icon-preview"
          id="categoryIconPreview"
        >
          📁
        </div>

      </div>


      <div class="form-group">

        <label>
          Deskripsi
        </label>

        <textarea
          id="categoryDescription"
          placeholder="Deskripsi kategori"
        ></textarea>

      </div>


      <div class="checkbox">

        <input
          type="checkbox"
          id="categoryActive"
          checked
        >

        <label>
          Kategori aktif
        </label>

      </div>

      <br>


      <button
        type="submit"
        class="save-btn"
        id="categorySaveBtn"
      >
        Simpan Kategori
      </button>

    </form>

  </div>

</div>


<!-- PRODUCT MODAL -->

<div
  class="modal"
  id="productModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="productModalTitle">
        Tambah Produk
      </h3>

      <button
        class="close-btn"
        onclick="closeProductModal()"
      >
        ×
      </button>

    </div>


    <form id="productForm">

      <input
        type="hidden"
        id="productId"
      >


      <div class="form-group">

        <label>
          Nama Produk
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Nama produk"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Kategori
        </label>

        <select
          id="productCategory"
          required
        >

          <option value="">
            Pilih kategori
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Slug
        </label>

        <input
          type="text"
          id="productSlug"
          placeholder="nama-produk"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Deskripsi
        </label>

        <textarea
          id="productDescription"
          placeholder="Deskripsi produk"
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          Image URL
        </label>

        <input
          type="url"
          id="productImage"
          placeholder="https://..."
        >

      </div>


      <div class="form-group">

        <label>
          Gallery JSON
        </label>

        <textarea
          id="productGallery"
          placeholder='["https://gambar1.jpg","https://gambar2.jpg"]'
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          Harga
        </label>

        <input
          type="number"
          id="productPrice"
          placeholder="50000"
          min="0"
          step="0.01"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Harga Asli
        </label>

        <input
          type="number"
          id="productOriginalPrice"
          placeholder="75000"
          min="0"
          step="0.01"
        >

      </div>


      <div class="form-group">

        <label>
          Diskon (%)
        </label>

        <input
          type="number"
          id="productDiscount"
          placeholder="20"
          min="0"
          max="100"
          step="0.01"
        >

      </div>


      <div class="form-group">

        <label>
          Platform
        </label>

        <select id="productPlatform">

          <option value="Shopee">
            Shopee
          </option>

          <option value="TikTok">
            TikTok
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Affiliate URL
        </label>

        <input
          type="url"
          id="productAffiliate"
          placeholder="https://..."
        >

      </div>


      <div class="form-group">

        <label>
          External Product ID
        </label>

        <input
          type="text"
          id="productExternalId"
          placeholder="ID produk platform"
        >

      </div>


      <div class="form-group">

        <label>
          Rating
        </label>

        <input
          type="number"
          id="productRating"
          placeholder="4.8"
          min="0"
          max="5"
          step="0.1"
        >

      </div>


      <div class="form-group">

        <label>
          Jumlah Terjual
        </label>

        <input
          type="number"
          id="productSold"
          placeholder="100"
          min="0"
        >

      </div>


      <div class="checkbox-row">

        <label class="checkbox">

          <input
            type="checkbox"
            id="productFeatured"
          >

          Featured

        </label>


        <label class="checkbox">

          <input
            type="checkbox"
            id="productTrending"
          >

          Trending

        </label>


        <label class="checkbox">

          <input
            type="checkbox"
            id="productActive"
            checked
          >

          Aktif

        </label>

      </div>


      <button
        type="submit"
        class="save-btn"
        id="productSaveBtn"
      >
        Simpan Produk
      </button>

    </form>

  </div>

</div>


<div id="message"></div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://fmftcisigssgfjqqezqz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0YyKpZ3_HOED9iHlgfJldw_4ZrugD7C";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   GLOBAL
===================================== */

let currentUser = null;

let categories = [];

let products = [];


/* =====================================
   MESSAGE
===================================== */

function showMessage(text){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.classList.add("show");

  setTimeout(() => {

    message.classList.remove("show");

  },3000);

}


/* =====================================
   INIT
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if(error || !data.user){

    window.location.href =
      "admin.html";

    return;

  }


  currentUser =
    data.user;


  /* CHECK ADMIN */

  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id",currentUser.id)
    .single();


  if(
    profileError ||
    !profile ||
    profile.role !== "admin"
  ){

    await supabaseClient.auth.signOut();

    window.location.href =
      "admin.html";

    return;

  }


  document.getElementById(
    "adminName"
  ).textContent =
    currentUser.email;


  await loadCategories();

  await loadProducts();

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "admin.html";

}


/* =====================================
   SECTION
===================================== */

function showSection(section){

  const categoriesSection =
    document.getElementById(
      "categoriesSection"
    );

  const productsSection =
    document.getElementById(
      "productsSection"
    );

  const categoryMenu =
    document.getElementById(
      "categoryMenu"
    );

  const productMenu =
    document.getElementById(
      "productMenu"
    );


  if(section === "categories"){

    categoriesSection.style.display =
      "block";

    productsSection.style.display =
      "none";

    categoryMenu.classList.add(
      "active"
    );

    productMenu.classList.remove(
      "active"
    );

  }else{

    categoriesSection.style.display =
      "none";

    productsSection.style.display =
      "block";

    categoryMenu.classList.remove(

/* =====================================
   EDIT CATEGORY
===================================== */

function editCategory(id){

  const category =
    categories.find(
      c => c.id === id
    );


  if(!category) return;


  document.getElementById(
    "categoryModalTitle"
  ).textContent =
    "Edit Kategori";


  document.getElementById(
    "categoryId"
  ).value =
    category.id;


  document.getElementById(
    "categoryName"
  ).value =
    category.name || "";


  document.getElementById(
    "categorySlug"
  ).value =
    category.slug || "";


  const icon =
    category.icon || "📁";


  const iconOptions = [
    "📁",
    "📱",
    "👕",
    "💄",
    "🏠",
    "🍔",
    "🎮",
    "⚽",
    "📚",
    "👜",
    "👟",
    "💻",
    "🎧",
    "⌚",
    "🚗",
    "🧸",
    "💍",
    "🎁"
  ];


  if(iconOptions.includes(icon)){

    document.getElementById(
      "categoryIconSelect"
    ).value =
      icon;

    document.getElementById(
      "categoryIconCustom"
    ).value = "";

  }else{

    document.getElementById(
      "categoryIconSelect"
    ).value =
      "📁";

    document.getElementById(
      "categoryIconCustom"
    ).value =
      icon;

  }


  document.getElementById(
    "categoryDescription"
  ).value =
    category.description || "";


  document.getElementById(
    "categoryActive"
  ).checked =
    !!category.is_active;


  updateIconPreview();


  document.getElementById(
    "categoryModal"
  ).classList.add("show");

}

   SAVE CATEGORY
===================================== */

document.getElementById(
  "categoryForm"
).addEventListener(

    event.preventDefault();

    const id =
      document.getElementById(
        "categoryId"
      ).value;

      document.getElementById(
        "categoryIconCustom"
      ).value.trim();


    const selectedIcon =

async function deleteCategory(id){

  const category =

      c => c.id === id
    );


  if(!category) return;


  const confirmDelete =
    confirm(
      `Hapus kategori "${category.name}"?`

    error
  } =
  await supabaseClient
    .from("categories")
    .delete()
    .eq("id",id);

      error.message
    );

/* =====================================
   FORMAT RUPIAH
===================================== */

function formatRupiah(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "-";

  }


  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(value);

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
