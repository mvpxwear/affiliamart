<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin - AffiliaMart</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f5f7f6;
      color: #17201a;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 70px;

      background: white;

      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #16a34a;
      font-size: 22px;
      font-weight: 800;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-name {
      font-size: 13px;
      color: #6b7280;
    }

    .logout-btn {
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      padding: 9px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       LAYOUT
    ========================= */

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 35px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 28px;
      font-weight: 800;
    }

    .welcome p {
      margin-top: 6px;
      color: #6b7280;
      font-size: 14px;
    }

    /* =========================
       STAT
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 13px;
    }

    .stat-value {
      margin-top: 7px;
      font-size: 28px;
      font-weight: 800;
      color: #16a34a;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .menu button {
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;

      padding: 11px 17px;

      border-radius: 10px;

      font-size: 13px;
      font-weight: 600;
    }

    .menu button.active {
      background: #16a34a;
      color: white;
      border-color: #16a34a;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .card-header h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .add-btn {
      border: 0;
      background: #16a34a;
      color: white;

      padding: 10px 15px;

      border-radius: 9px;

      font-size: 13px;
      font-weight: 700;
    }

    .add-btn:hover {
      background: #15803d;
    }

    /* =========================
       CATEGORY LIST
    ========================= */

    .category-list {
      display: grid;
      gap: 10px;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 15px;

      border: 1px solid #edf0ee;

      border-radius: 12px;

      background: #fafafa;
    }

    .category-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .category-icon {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #f0fdf4;

      font-size: 23px;
    }

    .category-info {
      min-width: 0;
    }

    .category-name {
      font-size: 14px;
      font-weight: 700;
    }

    .category-slug {
      margin-top: 3px;
      color: #9ca3af;
      font-size: 12px;
    }

    .status {
      display: inline-block;
      margin-top: 5px;

      padding: 3px 7px;

      border-radius: 6px;

      font-size: 10px;
      font-weight: 700;
    }

    .status.active {
      background: #dcfce7;
      color: #15803d;
    }

    .status.inactive {
      background: #fee2e2;
      color: #b91c1c;
    }

    .category-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .edit-btn,
    .delete-btn {
      border: 0;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .edit-btn {
      background: #eff6ff;
      color: #2563eb;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .loading,
    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #6b7280;
      font-size: 14px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.45);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;

      background: white;

      border-radius: 18px;

      padding: 25px;

      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 22px;
    }

    .modal-header h3 {
      font-size: 20px;
      font-weight: 800;
    }

    .close-btn {
      border: 0;
      background: #f3f4f6;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }
