<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produk - AffiliaMart</title>
  <meta name="description" content="Lihat detail produk pilihan AffiliaMart.">
  <meta name="robots" content="index,follow">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:"Inter",Arial,sans-serif;background:#f5f7f6;color:#17201a;line-height:1.6;padding-bottom:30px}
    a{text-decoration:none;color:inherit}

    header{height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:100;border-bottom:1px solid #edf0ee}
    .logo{font-size:25px;font-weight:800;letter-spacing:-1px;color:#16a34a;white-space:nowrap}
    nav{display:flex;align-items:center;gap:18px}
    nav a{color:#374151;font-size:14px;font-weight:600}
    nav a:hover{color:#16a34a}
    .back{background:#ecfdf3;color:#15803d!important;padding:9px 14px;border-radius:10px}

    .container{width:min(1120px,88%);margin:0 auto}
    .breadcrumb{padding:25px 0 10px;color:#6b7280;font-size:13px}
    .breadcrumb a{color:#16a34a;font-weight:600}

    .product-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:35px;margin:10px 0 70px}
    .gallery-card,.detail-card{background:#fff;border:1px solid #edf0ee;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
    .gallery-card{padding:18px;align-self:start}
    .main-image{height:520px;border-radius:17px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .main-image img{width:100%;height:100%;object-fit:contain}
    .placeholder{font-size:80px}
    .discount{position:absolute;top:16px;left:16px;background:#dc2626;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800}
    .thumbs{display:flex;gap:10px;overflow-x:auto;padding-top:12px}
    .thumb{width:72px;height:72px;flex:0 0 72px;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#f3f4f6;cursor:pointer}
    .thumb.active{border-color:#16a34a}
    .thumb img{width:100%;height:100%;object-fit:cover}

    .detail-card{padding:32px}
    .platform{display:inline-flex;background:#111827;color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:14px}
    .category{display:block;color:#16a34a;font-size:13px;font-weight:700;margin-bottom:8px}
    h1{font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-1.2px;margin-bottom:15px;color:#111827}
    .meta{display:flex;gap:15px;flex-wrap:wrap;color:#6b7280;font-size:13px;margin-bottom:22px}
    .price{font-size:30px;font-weight:800;color:#16a34a;line-height:1.2}
    .original{font-size:14px;color:#9ca3af;text-decoration:line-through;margin-top:4px}
    .description{margin-top:25px;padding-top:25px;border-top:1px solid #edf0ee;color:#4b5563;font-size:15px;white-space:pre-line}
    .affiliate{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
    .buy{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:#16a34a;color:white;font-size:14px;font-weight:700;transition:.2s}
    .buy:hover{background:#15803d;transform:translateY(-1px)}
    .home-btn{background:#f0fdf4;color:#15803d}
    .home-btn:hover{background:#dcfce7}

    .related-section{padding:0 0 50px}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
    .section-head h2{font-size:28px;letter-spacing:-.7px}
    .section-head p{color:#6b7280;font-size:14px;margin-top:5px}
    .related{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .card{background:#fff;border:1px solid #edf0ee;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.04);transition:.2s}
    .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
    .card-img{height:210px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
    .card-img img{width:100%;height:100%;object-fit:cover}
    .card-info{padding:16px}
    .card h3{font-size:15px;line-height:1.35;color:#111827;margin-bottom:8px}
    .card-price{font-size:16px;font-weight:800;color:#16a34a}
    .card-platform{font-size:10px;color:#6b7280;text-transform:uppercase;font-weight:700;margin-top:6px}
    .empty,.loading{text-align:center;padding:60px 20px;color:#6b7280}
    .error-box{background:#fff;border:1px solid #fecaca;border-radius:18px;padding:35px;text-align:center;color:#991b1b;margin:40px 0}

    footer{background:#111827;color:#fff;text-align:center;padding:38px 6%;margin-top:25px}
    .footer-logo{font-size:20px;font-weight:800;color:#4ade80;margin-bottom:8px}
    footer p{color:#9ca3af;font-size:13px}

    @media(max-width:850px){
      .product-layout{grid-template-columns:1fr;gap:18px}
      .main-image{height:430px}
      .related{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:600px){
      header{height:68px;padding:0 5%}.logo{font-size:21px}nav{gap:8px}nav a:not(.back){display:none}.back{padding:7px 10px;font-size:12px}
      .container{width:90%}.breadcrumb{padding-top:18px}.detail-card{padding:22px}.main-image{height:340px}.price{font-size:25px}.affiliate{flex-direction:column}.buy{width:100%}.related{grid-template-columns:1fr 1fr;gap:12px}.card-img{height:170px}.card-info{padding:12px}.card h3{font-size:13px}.card-price{font-size:14px}.section-head h2{font-size:24px}
    }
    @media(max-width:400px){.related{grid-template-columns:1fr}.card-img{height:210px}}
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">AffiliaMart</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#kategori">Kategori</a>
    <a href="index.html#produk">Produk</a>
    <a href="admin.html" class="back">🔐 Admin</a>
  </nav>
</header>

<main class="container">
  <div class="breadcrumb" id="breadcrumb">Home / Produk</div>
  <div id="content"><div class="loading">⏳ Memuat produk...</div></div>
</main>

<footer>
  <div class="footer-logo">AffiliaMart</div>
  <p>Platform rekomendasi produk affiliate Shopee &amp; TikTok.</p>
</footer>

<script>
const SUPABASE_URL="https://fmftcisigssgfjqqezqz.supabase.co";
const SUPABASE_KEY="sb_publishable_0YyKpZ3_HOED9iHlgfJldw_4ZrugD7C";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function escapeHTML(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function formatRupiah(value){if(value===null||value===undefined||value==="")return "-";return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(value);}
function makeSlug(text){return String(text||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g,"").trim().replace(/\s+/g,"-").replace(/-+/g,"-");}
function getSlug(){const path=window.location.pathname.split("/").filter(Boolean);const last=path[path.length-1]||"";return last==="product.html"?(new URLSearchParams(window.location.search).get("slug")||""):decodeURIComponent(last);}
function getVisitorId(){let id=localStorage.getItem("affiliamart_visitor_id");if(!id){id=window.crypto&&crypto.randomUUID?crypto.randomUUID():"visitor-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem("affiliamart_visitor_id",id)}return id;}
async function trackEvent(eventType,productId=null,platform=null){try{await supabaseClient.from("analytics_events").insert({event_type:eventType,product_id:productId,platform:platform,visitor_id:getVisitorId()})}catch(e){console.error("Analytics:",e)}}

function imageArray(product){
  let arr=[];
  if(product.image_url) arr.push(product.image_url);
  if(Array.isArray(product.gallery)) arr=arr.concat(product.gallery);
  return [...new Set(arr.filter(Boolean))];
}

function renderGallery(images,name){
  if(!images.length)return `<div class="main-image"><div class="placeholder">🛍️</div></div>`;
  return `<div class="gallery-card"><div class="main-image" id="mainImageWrap"><img id="mainImage" src="${escapeHTML(images[0])}" alt="${escapeHTML(name)}" onerror="this.style.display='none'"></div>${images.length>1?`<div class="thumbs">${images.map((src,i)=>`<button class="thumb ${i===0?'active':''}" onclick="changeImage('${escapeHTML(src)}',this)"><img src="${escapeHTML(src)}" alt="Gambar ${i+1}" onerror="this.style.display='none'"></button>`).join("")}</div>`:""}</div>`;
}
function changeImage(src,el){const img=document.getElementById("mainImage");if(img){img.style.display="block";img.src=src}document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));el.classList.add("active");}

function productUrl(product){return "/af/product/"+encodeURIComponent(makeSlug(product.slug||product.name));}

async function loadProduct(){
  const slug=makeSlug(getSlug());
  if(!slug){showError("Produk tidak ditemukan.");return;}

  const {data:product,error}=await supabaseClient.from("products").select(`id,category_id,name,slug,description,image_url,gallery,price,original_price,discount_percent,platform,affiliate_url,rating,sold_count,is_featured,is_trending,is_active,created_at`).eq("slug",slug).eq("is_active",true).maybeSingle();
  if(error){console.error(error);showError("Gagal memuat produk: "+error.message);return;}
  if(!product){showError("Produk tidak ditemukan atau sudah tidak aktif.");return;}

  await trackEvent("page_view",product.id,product.platform||null);

  let category=null;
  if(product.category_id){const r=await supabaseClient.from("categories").select("id,name,slug").eq("id",product.category_id).maybeSingle();category=r.data||null;}

  document.title=(product.name||"Produk")+" - AffiliaMart";
  const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=(product.description||("Lihat detail "+product.name+" di AffiliaMart.")).slice(0,160);
  document.getElementById("breadcrumb").innerHTML=`<a href="index.html">Home</a> / ${category?escapeHTML(category.name):"Produk"} / ${escapeHTML(product.name)}`;

  const images=imageArray(product);
  const platform=String(product.platform||"").toLowerCase().trim();
  const affiliate=product.affiliate_url||"";
  let affiliateHTML=affiliate?`<a class="buy" href="${escapeHTML(affiliate)}" target="_blank" rel="noopener noreferrer" onclick="affiliateClick(event,'${escapeHTML(product.id)}','${escapeHTML(platform)}','${escapeHTML(affiliate)}')">${platform==='tiktok'?'🎵':'🛍️'} Lihat di ${escapeHTML(platform?platform.charAt(0).toUpperCase()+platform.slice(1):'Marketplace')}</a>`:`<div class="buy" style="background:#9ca3af;cursor:not-allowed">Link affiliate belum tersedia</div>`;
  const original=product.original_price&&Number(product.original_price)>Number(product.price)?`<div class="original">${formatRupiah(product.original_price)}</div>`:"";
  const discount=product.discount_percent&&Number(product.discount_percent)>0?`<span>-${Number(product.discount_percent)}%</span>`:"";
  const meta=[];if(product.rating!==null&&product.rating!==undefined&&product.rating!=="")meta.push("⭐ "+Number(product.rating).toFixed(1));if(Number(product.sold_count)>0)meta.push(Number(product.sold_count).toLocaleString("id-ID")+" terjual");

  document.getElementById("content").innerHTML=`
    <div class="product-layout">
      ${renderGallery(images,product.name)}
      <article class="detail-card">
        ${platform?`<div class="platform">${escapeHTML(platform)}</div>`:""}
        ${category?`<a class="category" href="index.html#kategori">${escapeHTML(category.name)}</a>`:""}
        <h1>${escapeHTML(product.name)}</h1>
        ${meta.length?`<div class="meta">${meta.map(escapeHTML).join("<span>•</span>")}</div>`:""}
        <div class="price">${formatRupiah(product.price)}</div>
        ${original}
        ${discount?`<div style="margin-top:5px;color:#dc2626;font-size:13px;font-weight:700">${discount} hemat</div>`:""}
        <div class="description">${escapeHTML(product.description||"Belum ada deskripsi produk.")}</div>
        <div class="affiliate">${affiliateHTML}<a class="buy home-btn" href="index.html">← Kembali ke Produk</a></div>
      </article>
    </div>
    <section class="related-section">
      <div class="section-head"><div><h2>Produk Terkait</h2><p>Produk lain yang mungkin kamu suka</p></div></div>
      <div class="related" id="relatedList"><div class="loading">⏳ Memuat produk terkait...</div></div>
    </section>`;

  loadRelated(product);
}

async function loadRelated(product){
  let query=supabaseClient.from("products").select("id,category_id,name,slug,image_url,gallery,price,platform,is_active").eq("is_active",true).neq("id",product.id).limit(4);
  if(product.category_id)query=query.eq("category_id",product.category_id);
  const {data,error}=await query.order("created_at",{ascending:false});
  if(error){console.error(error);document.getElementById("relatedList").innerHTML="<div class='empty'>Produk terkait belum tersedia.</div>";return;}
  let list=data||[];
  if(!list.length){const fallback=await supabaseClient.from("products").select("id,category_id,name,slug,image_url,gallery,price,platform,is_active").eq("is_active",true).neq("id",product.id).order("created_at",{ascending:false}).limit(4);list=fallback.data||[];}
  document.getElementById("relatedList").innerHTML=list.length?list.map(p=>{const img=p.image_url||(Array.isArray(p.gallery)&&p.gallery[0])||"";return `<a class="card" href="${escapeHTML(productUrl(p))}"><div class="card-img">${img?`<img src="${escapeHTML(img)}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.style.display='none'">`:`<div class="placeholder" style="font-size:50px">🛍️</div>`}</div><div class="card-info"><h3>${escapeHTML(p.name)}</h3><div class="card-price">${formatRupiah(p.price)}</div><div class="card-platform">${escapeHTML(p.platform||"")}</div></div></a>`}).join(""):"<div class='empty'>Belum ada produk terkait.</div>";
}

async function affiliateClick(event,id,platform,url){event.preventDefault();await trackEvent("product_click",id,platform);window.open(url,"_blank","noopener,noreferrer");}
function showError(message){document.getElementById("content").innerHTML=`<div class="error-box"><h2>Produk tidak tersedia</h2><p style="margin-top:8px">${escapeHTML(message)}</p><a class="buy" style="margin-top:20px" href="index.html">← Kembali ke AffiliaMart</a></div>`;}
loadProduct();
</script>
</body>
</html>
