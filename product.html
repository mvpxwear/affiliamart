<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Produk - AffiliaMart</title>

  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =========================
       FONT
  ========================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f5f7f6;
      color: #17201a;
      line-height: 1.5;
      padding-bottom: 30px;
    }

    a {
      text-decoration: none;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      position: sticky;
      top: 0;

      z-index: 1000;

      border-bottom: 1px solid #edf0ee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #16a34a;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a {
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 13px;
      border-radius: 10px;
    }

    nav a:hover {
      color: #16a34a;
      background: #f0fdf4;
    }

    .admin-link {
      background: #ecfdf3;
      color: #15803d !important;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 1180px;
      margin: auto;
      padding: 0 6%;
    }


    /* =========================
       BREADCRUMB
    ========================= */

    .breadcrumb {
      padding-top: 28px;
      margin-bottom: 22px;

      display: flex;
      align-items: center;
      gap: 8px;

      color: #6b7280;
      font-size: 14px;

      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: #16a34a;
      font-weight: 600;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      min-height: 430px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: #6b7280;
      font-size: 17px;
    }


    /* =========================
       ERROR
    ========================= */

    .error-box {
      background: white;
      border: 1px solid #edf0ee;
      border-radius: 20px;

      padding: 60px 25px;

      text-align: center;

      margin-bottom: 70px;
    }

    .error-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .error-box h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .error-box p {
      color: #6b7280;
      font-size: 14px;
    }

    .back-btn {
      display: inline-block;

      margin-top: 22px;

      background: #16a34a;
      color: white;

      padding: 12px 20px;

      border-radius: 11px;

      font-size: 14px;
      font-weight: 700;
    }


    /* =========================
       PRODUCT DETAIL
    ========================= */

    .product-detail {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 50px;

      background: white;

      border: 1px solid #edf0ee;

      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.04);

      margin-bottom: 70px;
    }


    /* =========================
       IMAGE
    ========================= */

    .main-image {
      width: 100%;
      aspect-ratio: 1 / 1;

      border-radius: 20px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #f0fdf4,
          #ecfdf5
        );

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .image-placeholder {
      font-size: 90px;
    }


    /* =========================
       DISCOUNT BADGE
    ========================= */

    .discount-badge {
      position: absolute;

      top: 16px;
      left: 16px;

      background: #dc2626;

      color: white;

      padding: 8px 11px;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 800;

      z-index: 2;
    }


    /* =========================
       PRODUCT INFO
    ========================= */

    .product-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .platform-badge {
      display: inline-flex;

      align-self: flex-start;

      padding: 7px 11px;

      border-radius: 8px;

      background: #111827;

      color: white;

      font-size: 11px;

      font-weight: 700;

      text-transform: capitalize;

      margin-bottom: 15px;
    }

    .category-label {
      color: #16a34a;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .product-title {
      font-size: clamp(28px, 4vw, 42px);

      line-height: 1.15;

      letter-spacing: -1.2px;

      font-weight: 800;

      color: #111827;

      margin-bottom: 18px;
    }

    .rating {
      display: flex;

      align-items: center;

      gap: 10px;

      color: #6b7280;

      font-size: 13px;

      margin-bottom: 20px;
    }

    .price {
      color: #16a34a;

      font-size: 30px;

      font-weight: 800;

      line-height: 1.2;
    }

    .original-price {
      color: #9ca3af;

      text-decoration: line-through;

      font-size: 14px;

      margin-top: 4px;
    }

    .saving {
      display: inline-block;

      margin-top: 8px;

      color: #15803d;

      background: #ecfdf3;

      padding: 5px 9px;

      border-radius: 7px;

      font-size: 12px;

      font-weight: 700;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      margin-top: 25px;

      padding-top: 22px;

      border-top: 1px solid #edf0ee;
    }

    .description h3 {
      font-size: 16px;

      margin-bottom: 9px;
    }

    .description p {
      color: #6b7280;

      font-size: 14px;

      line-height: 1.8;

      white-space: pre-line;
    }


    /* =========================
       AFFILIATE BUTTONS
    ========================= */

    .affiliate-title {
      margin-top: 25px;

      margin-bottom: 12px;

      font-size: 15px;

      font-weight: 700;
    }

    .affiliate-buttons {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .affiliate-btn {
      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 50px;

      border-radius: 11px;

      color: white;

      font-size: 14px;

      font-weight: 700;

      transition: 0.2s ease;
    }

    .affiliate-btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .shopee {
      background: #ee4d2d;
    }

    .tiktok {
      background: #111827;
    }

    .affiliate-btn.disabled {
      background: #d1d5db;

      color: #6b7280;

      cursor: not-allowed;
    }


    /* =========================
       SOLD
    ========================= */

    .sold {
      margin-top: 13px;

      color: #6b7280;

      font-size: 12px;
    }


    /* =========================
       RELATED
    ========================= */

    .related-section {
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 28px;

      font-weight: 800;

      letter-spacing: -0.8px;

      margin-bottom: 8px;
    }

    .section-subtitle {
      color: #6b7280;

      font-size: 14px;

      margin-bottom: 25px;
    }

    .related-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }


    /* =========================
       RELATED CARD
    ========================= */

    .related-card {
      background: white;

      border: 1px solid #edf0ee;

      border-radius: 17px;

      overflow: hidden;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.04);

      transition: 0.2s ease;
    }

    .related-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 12px 28px rgba(0,0,0,0.08);
    }

    .related-image {
      height: 210px;

      background:
        linear-gradient(
          135deg,
          #f0fdf4,
          #ecfdf5
        );

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }

    .related-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .related-placeholder {
      font-size: 60px;
    }

    .related-info {
      padding: 15px;
    }

    .related-name {
      font-size: 14px;

      font-weight: 700;

      color: #111827;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;

      min-height: 42px;
    }

    .related-price {
      color: #16a34a;

      font-size: 15px;

      font-weight: 800;

      margin-top: 7px;
    }

    .related-btn {
      display: block;

      text-align: center;

      margin-top: 11px;

      padding: 9px;

      border-radius: 9px;

      background: #16a34a;

      color: white;

      font-size: 12px;

      font-weight: 700;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111827;

      color: white;

      text-align: center;

      padding: 38px 6%;

      margin-top: 20px;
    }

    .footer-logo {
      font-size: 21px;

      font-weight: 800;

      color: #4ade80;

      margin-bottom: 7px;
    }

    footer p {
      color: #9ca3af;

      font-size: 13px;
    }

    .copyright {
      margin-top: 15px;

      color: #6b7280;

      font-size: 11px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        height: 68px;

        padding: 0 5%;
      }

      .logo {
        font-size: 21px;
      }

      nav {
        gap: 5px;
      }

      nav a {
        font-size: 12px;

        padding: 7px 8px;
      }

      nav a:nth-child(2),
      nav a:nth-child(3) {
        display: none;
      }

      .container {
        padding: 0 5%;
      }

      .breadcrumb {
        padding-top: 22px;

        font-size: 13px;
      }

      .product-detail {
        grid-template-columns: 1fr;

        gap: 25px;

        padding: 14px;

        border-radius: 19px;

        margin-bottom: 50px;
      }

      .main-image {
        aspect-ratio: 1 / 1;

        border-radius: 15px;
      }

      .product-info {
        padding: 5px;
      }

      .product-title {
        font-size: 28px;

        letter-spacing: -0.8px;
      }

      .price {
        font-size: 27px;
      }

      .related-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 13px;
      }

      .related-image {
        height: 170px;
      }

      .section-title {
        font-size: 24px;
      }

    }


    @media (max-width: 430px) {

      .affiliate-buttons {
        grid-template-columns: 1fr;
      }

      .related-image {
        height: 155px;
      }

      .related-info {
        padding: 12px;
      }

      .related-name {
        font-size: 13px;
      }

      .related-price {
        font-size: 14px;
      }

    }

  </style>

</head>

  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://fmftcisigssgfjqqezqz.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_0YyKpZ3_HOED9iHlgfJldw_4ZrugD7C";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       RUPIAH
    ========================= */

    function formatRupiah(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "-";
      }

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }
      ).format(Number(value));

    }


    /* =========================
       VISITOR ID
    ========================= */

    function getVisitorId() {

      let visitorId =
        localStorage.getItem(
          "affiliamart_visitor_id"
        );

      if (!visitorId) {

        if (
          window.crypto &&
          typeof window.crypto.randomUUID ===
          "function"
        ) {

          visitorId =
            window.crypto.randomUUID();

        } else {

          visitorId =
            "visitor-" +
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .substring(2, 12);

        }

        localStorage.setItem(
          "affiliamart_visitor_id",
          visitorId
        );

      }

      return visitorId;

    }


    /* =========================
       ANALYTICS
    ========================= */

    async function trackEvent(
      eventType,
      productId = null,
      platform = null
    ) {

      try {

        await supabaseClient
          .from("analytics_events")
          .insert({

            event_type:
              eventType,

            product_id:
              productId,

            platform:
              platform,

            visitor_id:
              getVisitorId()

          });

      } catch (error) {

        console.error(
          "Analytics error:",
          error
        );

      }

    }


    /* =========================
       GET SLUG
    ========================= */

    function getProductSlug() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return (
        params.get("slug") || ""
      ).trim();

    }


    /* =========================
       LOAD PRODUCT
    ========================= */

    async function loadProduct() {

      const container =
        document.getElementById(
          "productContainer"
        );


      const slug =
        getProductSlug();


      if (!slug) {

        showError(
          "Produk tidak ditemukan",
          "URL produk tidak memiliki slug."
        );

        return;

      }


      console.log(
        "Mencari slug:",
        slug
      );


      const {
        data: product,
        error
      } = await supabaseClient

        .from("products")

        .select(`
          id,
          category_id,
          name,
          slug,
          description,
          image_url,
          gallery,
          price,
          original_price,
          discount_percent,
          platform,
          external_product_id,
          affiliate_url,
          rating,
          sold_count,
          is_featured,
          is_trending,
          is_active,
          created_at
        `)

        .eq(
          "slug",
          slug
        )

        .eq(
          "is_active",
          true
        )

        .maybeSingle();


      if (error) {

        console.error(
          "Product error:",
          error
        );

        showError(
          "Gagal memuat produk",
          error.message
        );

        return;

      }


      if (!product) {

        showError(
          "Produk tidak ditemukan",
          "Produk mungkin sudah dihapus, dinonaktifkan, atau slug tidak sesuai."
        );

        return;

      }


      await renderProduct(
        product
      );


      await loadRelatedProducts(
        product
      );


      trackEvent(
        "product_view",
        product.id,
        normalizePlatform(
          product.platform
        )
      );

    }


    /* =========================
       RENDER PRODUCT
    ========================= */

    async function renderProduct(
      product
    ) {

      const container =
        document.getElementById(
          "productContainer"
        );


      /* CATEGORY */

      let categoryName =
        "Produk";


      if (product.category_id) {

        const {
          data: category
        } = await supabaseClient

          .from("categories")

          .select("id,name")

          .eq(
            "id",
            product.category_id
          )

          .maybeSingle();


        if (category) {

          categoryName =
            category.name;

        }

      }


      /* IMAGE */

      let imageHTML =
        '<div class="image-placeholder">🛍️</div>';


      if (
        product.image_url &&
        String(product.image_url).trim() !== ""
      ) {

        imageHTML = `

          <img
            src="${escapeHTML(product.image_url)}"
            alt="${escapeHTML(product.name)}"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='block';
            "
          >

          <div
            class="image-placeholder"
            style="display:none;"
          >
            🛍️
          </div>

        `;

      }


      /* DISCOUNT */

      let discountHTML = "";


      if (
        product.discount_percent !== null &&
        Number(product.discount_percent) > 0
      ) {

        discountHTML = `

          <div class="discount-badge">
            -${Number(product.discount_percent)}%
          </div>

        `;

      }


      /* PLATFORM */

      const platform =
        normalizePlatform(
          product.platform
        );


      let platformHTML = "";


      if (platform) {

        platformHTML = `

          <div class="platform-badge">
            ${escapeHTML(platform)}
          </div>

        `;

      }


      /* ORIGINAL PRICE */

      let originalPriceHTML = "";


      if (
        product.original_price &&
        Number(product.original_price) >
        Number(product.price)
      ) {

        originalPriceHTML = `

          <div class="original-price">
            ${formatRupiah(
              product.original_price
            )}
          </div>

        `;

      }


      /* SAVING */

      let savingHTML = "";


      if (
        product.original_price &&
        product.price &&
        Number(product.original_price) >
        Number(product.price)
      ) {

        const saving =
          Number(product.original_price) -
          Number(product.price);


        savingHTML = `

          <div class="saving">
            Hemat ${formatRupiah(saving)}
          </div>

        `;

      }


      /* RATING */

      let ratingHTML = "";


      if (
        product.rating !== null &&
        product.rating !== undefined &&
        product.rating !== ""
      ) {

        ratingHTML += `
          <span>
            ⭐ ${Number(product.rating).toFixed(1)}
          </span>
        `;

      }


      if (
        product.sold_count !== null &&
        product.sold_count !== undefined &&
        Number(product.sold_count) > 0
      ) {

        ratingHTML += `

          <span>
            ${Number(
              product.sold_count
            ).toLocaleString("id-ID")}
            terjual
          </span>

        `;

      }


      /* DESCRIPTION */

      const description =
        product.description ||
        "Produk pilihan AffiliaMart.";


      /* AFFILIATE LINKS */

      const affiliateURL =
        product.affiliate_url || "";


      let shopeeURL = "";
      let tiktokURL = "";


      if (platform === "shopee") {

        shopeeURL =
          affiliateURL;

      }


      if (platform === "tiktok") {

        tiktokURL =
          affiliateURL;

      }


      /*
        Jika nanti struktur database
        memiliki kolom khusus:
        shopee_url / tiktok_url,
        bagian ini bisa dikembangkan.
      */


      let affiliateButtons = "";


      if (shopeeURL) {

        affiliateButtons += `

          <a
            href="${escapeHTML(shopeeURL)}"
            class="affiliate-btn shopee"
            target="_blank"
            rel="noopener noreferrer"
            onclick="handleAffiliateClick(
              event,
              '${escapeHTML(product.id)}',
              'shopee',
              '${escapeHTML(shopeeURL)}'
            )"
          >
            🛍️ Beli di Shopee
          </a>

        `;

      } else {

        affiliateButtons += `

          <div class="affiliate-btn disabled">
            🛍️ Shopee tidak tersedia
          </div>

        `;

      }


      if (tiktokURL) {

        affiliateButtons += `

          <a
            href="${escapeHTML(tiktokURL)}"
            class="affiliate-btn tiktok"
            target="_blank"
            rel="noopener noreferrer"
            onclick="handleAffiliateClick(
              event,
              '${escapeHTML(product.id)}',
              'tiktok',
              '${escapeHTML(tiktokURL)}'
            )"
          >
            🎵 Beli di TikTok
          </a>

        `;

      } else {

        affiliateButtons += `

          <div class="affiliate-btn disabled">
            🎵 TikTok tidak tersedia
          </div>

        `;

      }


      /* TITLE */

      document.title =
        product.name +
        " - AffiliaMart";


      /* BREADCRUMB */

      document.getElementById(
        "breadcrumb"
      ).innerHTML = `

        <a href="index.html">
          Home
        </a>

        <span>/</span>

        <span>
          ${escapeHTML(categoryName)}
        </span>

        <span>/</span>

        <span>
          ${escapeHTML(product.name)}
        </span>

      `;


      /* HTML */

      container.innerHTML = `

        <article class="product-detail">


          <div class="main-image">

            ${imageHTML}

            ${discountHTML}

          </div>


          <div class="product-info">

            ${platformHTML}


            <div class="category-label">
              ${escapeHTML(categoryName)}
            </div>


            <h1 class="product-title">
              ${escapeHTML(product.name)}
            </h1>


            <div class="rating">

              ${ratingHTML}

            </div>


            <div class="price">
              ${formatRupiah(product.price)}
            </div>


            ${originalPriceHTML}


            ${savingHTML}


            <div class="description">

              <h3>
                Deskripsi Produk
              </h3>

              <p>
                ${escapeHTML(description)}
              </p>

            </div>


            <div class="affiliate-title">
              Pilih Marketplace
            </div>


            <div class="affiliate-buttons">

              ${affiliateButtons}

            </div>


            ${
              product.sold_count &&
              Number(product.sold_count) > 0
              ? `
                <div class="sold">
                  🔥 ${Number(
                    product.sold_count
                  ).toLocaleString("id-ID")}
                  terjual
                </div>
              `
              : ""
            }


          </div>


        </article>

      `;

    }


    /* =========================
       NORMALIZE PLATFORM
    ========================= */

    function normalizePlatform(
      platform
    ) {

      return String(
        platform || ""
      )
      .toLowerCase()
      .trim();

    }


    /* =========================
       RELATED PRODUCTS
    ========================= */

    async function loadRelatedProducts(
      product
    ) {

      const section =
        document.getElementById(
          "relatedSection"
        );

      const list =
        document.getElementById(
          "relatedList"
        );


      if (!product.category_id) {

        return;

      }


      const {
        data,
        error
      } = await supabaseClient

        .from("products")

        .select(`
          id,
          category_id,
          name,
          slug,
          image_url,
          price,
          original_price,
          discount_percent,
          platform,
          is_active,
          created_at
        `)

        .eq(
          "category_id",
          product.category_id
        )

        .eq(
          "is_active",
          true
        )

        .neq(
          "id",
          product.id
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        )

        .limit(8);


      if (error) {

        console.error(
          "Related products error:",
          error
        );

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        return;

      }


      list.innerHTML =
        data.map(
          function(item) {

            let imageHTML =
              '<div class="related-placeholder">🛍️</div>';


            if (
              item.image_url &&
              String(item.image_url).trim() !== ""
            ) {

              imageHTML = `

                <img
                  src="${escapeHTML(item.image_url)}"
                  alt="${escapeHTML(item.name)}"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='block';
                  "
                >

                <div
                  class="related-placeholder"
                  style="display:none;"
                >
                  🛍️
                </div>

              `;

            }


            return `

              <div class="related-card">


                <div class="related-image">

                  ${imageHTML}

                </div>


                <div class="related-info">

                  <div class="related-name">
                    ${escapeHTML(item.name)}
                  </div>


                  <div class="related-price">
                    ${formatRupiah(item.price)}
                  </div>


                  <a
                    href="product.html?slug=${encodeURIComponent(item.slug || "")}"
                    class="related-btn"
                  >
                    Lihat Produk
                  </a>

                </div>


              </div>

            `;

          }
        )
        .join("");


      section.style.display =
        "block";

    }


    /* =========================
       AFFILIATE CLICK
    ========================= */

    async function handleAffiliateClick(
      event,
      productId,
      platform,
      affiliateURL
    ) {

      event.preventDefault();


      const normalizedPlatform =
        normalizePlatform(
          platform
        );


      await trackEvent(
        "affiliate_click",
        productId,
        normalizedPlatform
      );


      window.open(
        affiliateURL,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /* =========================
       ERROR
    ========================= */

    function showError(
      title,
      message
    ) {

      document.getElementById(
        "productContainer"
      ).innerHTML = `

        <div class="error-box">

          <div class="error-icon">
            😕
          </div>

          <h2>
            ${escapeHTML(title)}
          </h2>

          <p>
            ${escapeHTML(message)}
          </p>

          <a
            href="index.html"
            class="back-btn"
          >
            ← Kembali ke Home
          </a>

        </div>

      `;

    }


    /* =========================
       START
    ========================= */

    loadProduct();


  </script>
